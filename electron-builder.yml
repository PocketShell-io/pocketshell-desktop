appId: com.pocketshell.desktop
productName: PocketShell
copyright: Copyright © 2026 Alexey Grigorev
directories:
  buildResources: build
  output: release
# WHAT GOES IN, and where the real filter is.
#
# There is no `!node_modules/...` line here for the renderer's libraries, and
# there deliberately never should be. electron-builder ships production
# `dependencies` and skips `devDependencies`, so package.json is the one place
# that decides — and after the CodeMirror mistake (~22 MB of already-bundled
# source in every installer) that list is down to what the packaged app truly
# require()s from disk. Restating the same decision as exclusion globs here
# would give it two homes that can disagree; tests/unit/packagedDependencies.test.ts
# guards the one home instead.
# The three directories electron-vite EMITS, named one by one rather than
# `out/**/*`. `out/` is gitignored scratch that anything may write to, and it
# had collected two passengers by the time anyone looked: `tsbuildinfo/`
# (incremental TypeScript state, which carries absolute paths from the build
# machine) and `probe-async/` (3 MB — a whole second copy of the renderer
# bundle, left behind by a debugging session). Both were shipping to users.
# A glob over a scratch directory ships whatever is lying in it.
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/*.{md,markdown}'
  - '!**/.{idea,git,cache,vscode,DS_Store}'
# macOS and Linux keep both architectures. Windows ships only x64 until
# packaging selects and verifies an ARM64 ConPTY closure: cross-building
# Electron alone currently leaves the installed win32-x64 native addon in it.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  # A ZIP, not an installer. The user runs the app unpacked, the way the
  # phone sideloads: download, unpack, run — and the update banner's download
  # link replaces this copy by hand. NSIS also cannot merge into the zip
  # pipeline (an arch list on nsis folds both runtimes into one ~170 MB
  # installer), while zip is naturally per-arch: one file per supported arch, no
  # collision thanks to `${arch}`. The update check on the phone and here is
  # a browser download, so nothing about updating needs an installer.
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  target:
    - target: zip
      arch:
        - x64
linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
