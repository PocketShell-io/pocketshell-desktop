# Release pipeline: a `v*` tag push builds installers for all three platforms,
# runs the Docker-backed smoke gate, and attaches the installers to a DRAFT
# GitHub release. The draft is finalized (real notes, --draft=false) by hand or
# by the release process in ~/.agents/skills/release — CI deliberately does not
# publish, so a bad tag is fixable before anything is public.
#
# Plain pushes to main run the same build matrix and smoke gate but stop there,
# so the pipeline itself is exercised continuously and a release tag never
# triggers it for the first time.
#
# PRs run both jobs too: typecheck/lint/unit on the build
# matrix, and the smoke gate's full unit + integration + E2E pass against the
# Docker fixtures — so a PR cannot merge with a red E2E (pair this with
# branch protection requiring the checks). The release job is gated on the tag
# ref and never fires for a PR.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time: a rapid pair of pushes to main (or new commits on
# a PR) cancels the stale matrix run instead of queueing 30-45-minute
# duplicates. Tag refs are unique per release, so this never touches a release
# build unless the same tag is re-pushed — where cancelling the stale one is
# what you want.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Electron's postinstall and electron-builder each re-download their
      # binaries per arch per run otherwise; the npm cache does not cover them.
      # Paths for other OSes do not exist here and are skipped, so one step
      # covers the whole matrix.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      # @pocketshell/core is a file:../pocketshell-core dependency: the shared
      # contract layer (sync, aplexer, SSH config) that desktop, web and the
      # Android embed all consume from one implementation. A runner checks out
      # this repo alone, so fetch the sibling to exactly the path the file:
      # spec names and build its dist/ — the same shape as a developer
      # machine, where the sibling checkout sits next to this one. STOPGAP:
      # when @pocketshell/core ships from npm (the tag-triggered publish
      # workflow is already wired in that repo) the dependency flips to a
      # registry version and these steps retire.
      - uses: actions/checkout@v7
        with:
          repository: PocketShell-io/pocketshell-core
          path: ../pocketshell-core
          persist-credentials: false
      - name: Build @pocketshell/core (file sibling)
        run: npm ci && npm run build
        working-directory: ../pocketshell-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # `dist` = icon + electron-vite build + electron-builder, which reads the
      # per-platform targets from electron-builder.yml. --publish never: the
      # artifacts travel via workflow artifacts to the release job below, so no
      # matrix job ever talks to GitHub Releases (three publishers racing on
      # one draft release is a race electron-builder loses sometimes).
      - run: npm run dist
        env:
          # electron-builder 25 wants a token present even with --publish never.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/latest*.yml

  smoke:
    name: Smoke gate (Docker-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      # @pocketshell/core is a file:../pocketshell-core dependency: the shared
      # contract layer (sync, aplexer, SSH config) that desktop, web and the
      # Android embed all consume from one implementation. A runner checks out
      # this repo alone, so fetch the sibling to exactly the path the file:
      # spec names and build its dist/ — the same shape as a developer
      # machine, where the sibling checkout sits next to this one. STOPGAP:
      # when @pocketshell/core ships from npm (the tag-triggered publish
      # workflow is already wired in that repo) the dependency flips to a
      # registry version and these steps retire.
      - uses: actions/checkout@v7
        with:
          repository: PocketShell-io/pocketshell-core
          path: ../pocketshell-core
          persist-credentials: false
      - name: Build @pocketshell/core (file sibling)
        run: npm ci && npm run build
        working-directory: ../pocketshell-core
      - run: npm ci
      # E2E launches Electron, which has no headless mode on Linux; Xvfb is
      # preinstalled on the runner image. The app's own off-screen mode (set by
      # playwright.config.ts) handles the rest.
      #
      # git records tests-docker/test_key as 644; Linux ssh refuses a
      # world-readable private key, which failed the gate's own sanity check on
      # the first CI run (the local Windows checkout never noticed). chmod
      # instead of fixing the mode in git: the key is a fixture for a
      # throwaway container, its permissions carry nothing.
      - run: chmod 600 tests-docker/test_key
      # Electron on the runner needs the shared libraries a browser needs
      # (libnss3, libgtk-3, ...) - the same set Playwright installs for its
      # chromium. Without them electron.launch dies before printing anything
      # useful, which is a diagnosis dead end for a first-time reader.
      - name: Install Electron system dependencies
        run: sudo npx playwright install-deps chromium
      # CI builds the fixture images fresh, so an unpinned dependency inside
      # them reaches CI before it reaches any developer's cached layer - the
      # gate is where drift lands first. The retry absorbs that class of
      # load-order flake cheaply; teardown and a state dump sit between the
      # attempts so a second failure is legible instead of a repeat of the
      # first. A DETERMINISTIC failure failing twice here is the signal to
      # read the logs, not to bump the retry count.
      - name: Run smoke gate (retry once)
        run: |
          if xvfb-run -a bash scripts/smoke.sh; then
            exit 0
          fi
          echo "::warning::smoke gate failed once - retrying"
          docker compose -f tests-docker/docker-compose.yml logs --tail=100 || true
          docker compose -f tests-docker/docker-compose.yml down --volumes --remove-orphans || true
          docker ps -a || true
          xvfb-run -a bash scripts/smoke.sh
      # Playwright retains traces (and failure screenshots) under test-results/
      # with retain-on-failure; without uploading them a Linux-only failure is
      # a name in a log line and nothing more.
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: |
            test-results/
            /home/runner/.pocketshell/desktop.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Dump fixture state (diagnostics)
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f tests-docker/docker-compose.yml logs --tail=200 || true
          for c in $(docker ps -q); do
            docker logs --tail=100 "$c" 2>&1 | head -100 || true
          done

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that talks to GitHub Releases; build and smoke — which run
    # on every PR — inherit the workflow's read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Create draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot discover the repo from a git
          # remote - say it outright or `gh release create` dies on "not a git
          # repository" with every artifact already sitting in dist/.
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist/
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Installers built by CI from $GITHUB_SHA. Notes are finalized before publishing." \
            dist/*
